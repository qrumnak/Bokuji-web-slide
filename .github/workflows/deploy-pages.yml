name: Publish presentation to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Use the workflow artifact as the Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        # A /src/main.jsx response can only come from branch-based root publishing.
        # Keep this idempotent so an old Pages setting cannot bypass the dist artifact.
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow

      - name: Build presentation
        run: npm run build

      - name: Verify project-site asset paths
        run: npm run verify:pages

      - name: Upload presentation
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
